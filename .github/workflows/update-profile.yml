name: Update Engineering Activity Monitor

on:
  schedule:
    - cron: '30 0 * * *' # 00:30 UTC daily
  workflow_dispatch:

concurrency:
  group: engineering-activity-monitor
  cancel-in-progress: true

jobs:
  refresh-activity:
    name: Refresh Engineering Telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Activity Telemetry Generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          python scripts/generate_activity.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/activity-monitor*.svg
          if git diff --staged --quiet; then
            echo "No activity changes to commit."
          else
            git commit -m "chore(telemetry): update Engineering Activity Monitor [skip ci]"
            git push
          fi
