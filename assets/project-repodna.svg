<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <linearGradient id="repoDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="repoDarkBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0.6" />
    </linearGradient>
    <pattern id="gridDotDark" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.8" fill="#1E293B" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes pulseTag {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }
    .pulse-tag { animation: pulseTag 3s infinite ease-in-out; }
    @media (prefers-reduced-motion: reduce) {
      .pulse-tag { animation: none !important; }
    }
  </style>

  <!-- Background Container -->
  <rect x="2" y="2" width="916" height="216" rx="12" fill="url(#repoDarkBg)" stroke="url(#repoDarkBorder)" stroke-width="1.5" />
  <rect x="4" y="4" width="912" height="212" rx="10" fill="url(#gridDotDark)" />

  <!-- Top Accent Bar -->
  <path d="M 12 2 L 180 2 L 195 16 L 350 16 L 365 2 L 908 2" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.4" />

  <!-- Left Content Column -->
  <g transform="translate(32, 28)">
    <!-- Category & Release Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="20" rx="4" fill="#111827" stroke="#38BDF8" stroke-width="0.8" />
      <text x="8" y="14" fill="#38BDF8" font-size="9.5" class="mono" font-weight="700">DEV INTELLIGENCE // 01</text>
      
      <!-- Release Pill -->
      <g transform="translate(190, 0)">
        <rect x="0" y="0" width="92" height="20" rx="4" fill="#1E293B" stroke="#5EEAD4" stroke-width="0.8" />
        <circle class="pulse-tag" cx="10" cy="10" r="3" fill="#5EEAD4" />
        <text x="18" y="14" fill="#5EEAD4" font-size="9.5" class="mono" font-weight="700">v0.3.0 LATEST</text>
      </g>
    </g>

    <!-- Project Title -->
    <text x="0" y="54" fill="#F8FAFC" font-size="28" class="sans" font-weight="800" letter-spacing="0.5">
      RepoDNA
      <tspan fill="#64748B" font-size="14" font-weight="500" class="mono"> — AI-Native Repository Intelligence</tspan>
    </text>

    <!-- Description -->
    <text x="0" y="80" fill="#94A3B8" font-size="12.5" class="sans" font-weight="400">
      Static architecture intelligence, Tree-sitter AST dependency graph visualizer, Tarjan SCC cycle
    </text>
    <text x="0" y="98" fill="#94A3B8" font-size="12.5" class="sans" font-weight="400">
      detector, and explainable code health platform with MCP Server &amp; Agent Skills.
    </text>

    <!-- Tech Badges -->
    <g transform="translate(0, 122)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="70" height="22" rx="4" fill="#111827" stroke="#1E293B" stroke-width="1" />
        <text x="35" y="15" fill="#38BDF8" font-size="10.5" class="mono" font-weight="600" text-anchor="middle">Python</text>
      </g>
      <g transform="translate(78, 0)">
        <rect x="0" y="0" width="80" height="22" rx="4" fill="#111827" stroke="#1E293B" stroke-width="1" />
        <text x="40" y="15" fill="#38BDF8" font-size="10.5" class="mono" font-weight="600" text-anchor="middle">FastAPI</text>
      </g>
      <g transform="translate(166, 0)">
        <rect x="0" y="0" width="94" height="22" rx="4" fill="#111827" stroke="#1E293B" stroke-width="1" />
        <text x="47" y="15" fill="#5EEAD4" font-size="10.5" class="mono" font-weight="600" text-anchor="middle">Tree-sitter</text>
      </g>
      <g transform="translate(268, 0)">
        <rect x="0" y="0" width="98" height="22" rx="4" fill="#111827" stroke="#1E293B" stroke-width="1" />
        <text x="49" y="15" fill="#5EEAD4" font-size="10.5" class="mono" font-weight="600" text-anchor="middle">TypeScript</text>
      </g>
      <g transform="translate(374, 0)">
        <rect x="0" y="0" width="80" height="22" rx="4" fill="#111827" stroke="#1E293B" stroke-width="1" />
        <text x="40" y="15" fill="#8B5CF6" font-size="10.5" class="mono" font-weight="600" text-anchor="middle">MCP AI</text>
      </g>
      <g transform="translate(462, 0)">
        <rect x="0" y="0" width="86" height="22" rx="4" fill="#111827" stroke="#1E293B" stroke-width="1" />
        <text x="43" y="15" fill="#FACC15" font-size="10.5" class="mono" font-weight="600" text-anchor="middle">React Flow</text>
      </g>
    </g>

    <!-- Action Link -->
    <g transform="translate(0, 160)">
      <text x="0" y="0" fill="#38BDF8" font-size="11.5" class="mono" font-weight="700">
        EXPLORE REPOSITORY <tspan fill="#5EEAD4">→</tspan> <tspan fill="#94A3B8">github.com/Cihanak1/RepoDNA</tspan>
      </text>
    </g>
  </g>

  <!-- Right Architecture Flow Box -->
  <g transform="translate(630, 24)">
    <rect x="0" y="0" width="258" height="172" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1" />
    <rect x="0" y="0" width="258" height="24" rx="8" fill="#1E293B" fill-opacity="0.6" />
    <text x="12" y="16" fill="#94A3B8" font-size="10" class="mono" font-weight="700">PIPELINE ARCHITECTURE</text>

    <!-- Node 1: AST Parser -->
    <g transform="translate(14, 38)">
      <rect x="0" y="0" width="230" height="26" rx="4" fill="#0D1322" stroke="#38BDF8" stroke-width="0.8" />
      <text x="12" y="17" fill="#E2E8F0" font-size="10" class="mono">1. Tree-sitter AST Parser</text>
    </g>
    <!-- Arrow down -->
    <path d="M 129 66 L 129 74" stroke="#5EEAD4" stroke-width="1.5" />
    <polygon points="129,78 126,73 132,73" fill="#5EEAD4" />

    <!-- Node 2: Tarjan SCC & Graph -->
    <g transform="translate(14, 80)">
      <rect x="0" y="0" width="230" height="26" rx="4" fill="#0D1322" stroke="#5EEAD4" stroke-width="0.8" />
      <text x="12" y="17" fill="#E2E8F0" font-size="10" class="mono">2. Tarjan SCC &amp; Graph Engine</text>
    </g>
    <!-- Arrow down -->
    <path d="M 129 108 L 129 116" stroke="#8B5CF6" stroke-width="1.5" />
    <polygon points="129,120 126,115 132,115" fill="#8B5CF6" />

    <!-- Node 3: AI MCP & Workstation -->
    <g transform="translate(14, 122)">
      <rect x="0" y="0" width="230" height="26" rx="4" fill="#0D1322" stroke="#8B5CF6" stroke-width="0.8" />
      <text x="12" y="17" fill="#E2E8F0" font-size="10" class="mono">3. MCP Server + React Studio</text>
    </g>
  </g>
</svg>
