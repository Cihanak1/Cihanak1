<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep refined midnight -->
    <linearGradient id="heroDarkBgEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D" />
      <stop offset="60%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#111A2E" />
    </linearGradient>

    <!-- Subtle Border Gradient -->
    <linearGradient id="heroDarkBorderEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0.25" />
    </linearGradient>

    <!-- Quiet Card Background for Right Panel -->
    <linearGradient id="panelDarkBgEn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111B2E" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0.9" />
    </linearGradient>

    <!-- Ambient Glow behind name -->
    <radialGradient id="nameGlowDarkEn" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; }
    
    @keyframes softPulseEn {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.92); }
    }
    
    .status-pulse-en {
      transform-origin: 48px 42px;
      animation: softPulseEn 3s infinite ease-in-out;
    }

    @media (prefers-reduced-motion: reduce) {
      .status-pulse-en { animation: none !important; }
    }
  </style>

  <!-- Outer Canvas Frame -->
  <rect x="1.5" y="1.5" width="917" height="277" rx="14" fill="url(#heroDarkBgEn)" stroke="url(#heroDarkBorderEn)" stroke-width="1.5" />
  
  <!-- Subtle Ambient Glow -->
  <rect x="2" y="2" width="600" height="276" rx="14" fill="url(#nameGlowDarkEn)" />

  <!-- ==================== LEFT COLUMN ==================== -->
  <g transform="translate(48, 0)">
    <!-- Top Meta Strip: Real Academic Status & Location -->
    <g transform="translate(0, 44)">
      <circle class="status-pulse-en" cx="0" cy="-4" r="3.5" fill="#5EEAD4" />
      <text x="12" y="0" fill="#94A3B8" font-size="11.5" class="mono" font-weight="500" letter-spacing="0.3">
        FIRAT UNIVERSITY <tspan fill="#475569">•</tspan> SOFTWARE ENGINEERING <tspan fill="#475569">•</tspan> ELAZIĞ, TR
      </text>
    </g>

    <!-- Main Name Title -->
    <text x="0" y="98" fill="#F8FAFC" font-size="38" class="sans" font-weight="800" letter-spacing="-0.8">
      Cihan Akalın
    </text>

    <!-- Role / Core Identity -->
    <text x="0" y="128" fill="#38BDF8" font-size="14.5" class="sans" font-weight="600">
      Software Engineering Student at Fırat University
    </text>

    <!-- Authentic Personal Statement -->
    <g transform="translate(0, 160)">
      <text x="0" y="0" fill="#94A3B8" font-size="13.5" class="sans" font-weight="400">
        I build developer tools and polished software experiences
      </text>
      <text x="0" y="22" fill="#94A3B8" font-size="13.5" class="sans" font-weight="400">
        that make engineering work clearer and more effective.
      </text>
    </g>

    <!-- Clean Engineering Focus Tags (Quiet, No Fake Jargon) -->
    <g transform="translate(0, 218)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="138" height="26" rx="6" fill="#131D31" stroke="#1E293B" stroke-width="1" />
        <text x="12" y="17" fill="#CBD5E1" font-size="11" class="sans" font-weight="500">Developer Tools</text>
      </g>

      <!-- Tag 2 -->
      <g transform="translate(146, 0)">
        <rect x="0" y="0" width="160" height="26" rx="6" fill="#131D31" stroke="#1E293B" stroke-width="1" />
        <text x="12" y="17" fill="#CBD5E1" font-size="11" class="sans" font-weight="500">Software Architecture</text>
      </g>

      <!-- Tag 3 -->
      <g transform="translate(314, 0)">
        <rect x="0" y="0" width="156" height="26" rx="6" fill="#131D31" stroke="#1E293B" stroke-width="1" />
        <text x="12" y="17" fill="#CBD5E1" font-size="11" class="sans" font-weight="500">Desktop Engineering</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: REAL PROJECTS PANEL ==================== -->
  <g transform="translate(534, 32)">
    <!-- Panel Container -->
    <rect x="0" y="0" width="342" height="216" rx="10" fill="url(#panelDarkBgEn)" stroke="#1E293B" stroke-width="1.2" />

    <!-- Section 1 Header: Currently Building -->
    <g transform="translate(20, 26)">
      <text x="0" y="0" fill="#64748B" font-size="10" class="mono" font-weight="700" letter-spacing="1">
        CURRENTLY BUILDING
      </text>
    </g>

    <!-- Project 1: RepoDNA -->
    <g transform="translate(20, 48)">
      <text x="0" y="14" fill="#38BDF8" font-size="13.5" class="sans" font-weight="700">RepoDNA</text>
      <rect x="68" y="2" width="46" height="16" rx="3" fill="#1E293B" />
      <text x="73" y="13.5" fill="#5EEAD4" font-size="9" class="mono" font-weight="600">v0.3.0</text>
      
      <text x="0" y="32" fill="#94A3B8" font-size="11.5" class="sans">
        AI-native repository intelligence and AST graph
      </text>
      <text x="0" y="47" fill="#94A3B8" font-size="11.5" class="sans">
        visualizer for codebases (Tree-sitter, MCP).
      </text>
    </g>

    <!-- Subtle In-Card Divider -->
    <line x1="20" y1="114" x2="322" y2="114" stroke="#1E293B" stroke-width="0.8" />

    <!-- Project 2: NiceWP -->
    <g transform="translate(20, 132)">
      <text x="0" y="14" fill="#8B5CF6" font-size="13.5" class="sans" font-weight="700">NiceWP</text>
      <rect x="56" y="2" width="56" height="16" rx="3" fill="#1E293B" />
      <text x="61" y="13.5" fill="#38BDF8" font-size="9" class="mono" font-weight="600">v0.0.23</text>

      <text x="0" y="32" fill="#94A3B8" font-size="11.5" class="sans">
        Resource-conscious dynamic wallpaper engine
      </text>
      <text x="0" y="47" fill="#94A3B8" font-size="11.5" class="sans">
        for Windows 11 &amp; 10 (WinUI 3, .NET 10).
      </text>
    </g>
  </g>
</svg>
