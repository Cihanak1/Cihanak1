<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Crisp, refined daylight -->
    <linearGradient id="heroLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Subtle Border Gradient -->
    <linearGradient id="heroLightBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.3" />
    </linearGradient>

    <!-- Quiet Card Background for Right Panel -->
    <linearGradient id="panelLightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; }
    
    @keyframes softPulseLight {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.92); }
    }
    
    .status-pulse-light {
      transform-origin: 48px 42px;
      animation: softPulseLight 3s infinite ease-in-out;
    }

    @media (prefers-reduced-motion: reduce) {
      .status-pulse-light { animation: none !important; }
    }
  </style>

  <!-- Outer Canvas Frame -->
  <rect x="1.5" y="1.5" width="917" height="277" rx="14" fill="url(#heroLightBg)" stroke="url(#heroLightBorder)" stroke-width="1.5" />

  <!-- ==================== LEFT COLUMN ==================== -->
  <g transform="translate(48, 0)">
    <!-- Top Meta Strip: Real Academic Status & Location -->
    <g transform="translate(0, 44)">
      <circle class="status-pulse-light" cx="0" cy="-4" r="3.5" fill="#0D9488" />
      <text x="12" y="0" fill="#64748B" font-size="11.5" class="mono" font-weight="600" letter-spacing="0.3">
        FIRAT ÜNİVERSİTESİ <tspan fill="#CBD5E1">•</tspan> YAZILIM MÜHENDİSLİĞİ <tspan fill="#CBD5E1">•</tspan> ELAZIĞ
      </text>
    </g>

    <!-- Main Name Title -->
    <text x="0" y="98" fill="#0F172A" font-size="38" class="sans" font-weight="800" letter-spacing="-0.8">
      Cihan Akalın
    </text>

    <!-- Role / Core Identity -->
    <text x="0" y="128" fill="#0284C7" font-size="14.5" class="sans" font-weight="600">
      Fırat Üniversitesi'nde Yazılım Mühendisliği Öğrencisi
    </text>

    <!-- Authentic Personal Statement -->
    <g transform="translate(0, 160)">
      <text x="0" y="0" fill="#475569" font-size="13.5" class="sans" font-weight="400">
        Geliştiricileri daha üretken kılan araçlar ve
      </text>
      <text x="0" y="22" fill="#475569" font-size="13.5" class="sans" font-weight="400">
        temiz yazılım deneyimleri geliştiriyorum.
      </text>
    </g>

    <!-- Clean Engineering Focus Tags (Quiet, No Fake Jargon) -->
    <g transform="translate(0, 218)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="138" height="26" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="17" fill="#334155" font-size="11" class="sans" font-weight="600">Developer Tools</text>
      </g>

      <!-- Tag 2 -->
      <g transform="translate(146, 0)">
        <rect x="0" y="0" width="160" height="26" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="17" fill="#334155" font-size="11" class="sans" font-weight="600">Software Architecture</text>
      </g>

      <!-- Tag 3 -->
      <g transform="translate(314, 0)">
        <rect x="0" y="0" width="156" height="26" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="17" fill="#334155" font-size="11" class="sans" font-weight="600">Desktop Engineering</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: REAL PROJECTS PANEL ==================== -->
  <g transform="translate(534, 32)">
    <!-- Panel Container -->
    <rect x="0" y="0" width="342" height="216" rx="10" fill="url(#panelLightBg)" stroke="#CBD5E1" stroke-width="1.2" />

    <!-- Section 1 Header: Currently Building -->
    <g transform="translate(20, 26)">
      <text x="0" y="0" fill="#64748B" font-size="10" class="mono" font-weight="700" letter-spacing="1">
        ŞU ANDA GELİŞTİRİLENLER
      </text>
    </g>

    <!-- Project 1: RepoDNA -->
    <g transform="translate(20, 48)">
      <text x="0" y="14" fill="#0284C7" font-size="13.5" class="sans" font-weight="700">RepoDNA</text>
      <rect x="68" y="2" width="46" height="16" rx="3" fill="#E2E8F0" />
      <text x="73" y="13.5" fill="#0D9488" font-size="9" class="mono" font-weight="700">v0.3.0</text>
      
      <text x="0" y="32" fill="#475569" font-size="11.5" class="sans">
        Yapay zekâ yerel depo mimarisi analizi ve AST
      </text>
      <text x="0" y="47" fill="#475569" font-size="11.5" class="sans">
        çizge görselleştiricisi (Tree-sitter, MCP).
      </text>
    </g>

    <!-- Subtle In-Card Divider -->
    <line x1="20" y1="114" x2="322" y2="114" stroke="#E2E8F0" stroke-width="1" />

    <!-- Project 2: NiceWP -->
    <g transform="translate(20, 132)">
      <text x="0" y="14" fill="#7C3AED" font-size="13.5" class="sans" font-weight="700">NiceWP</text>
      <rect x="56" y="2" width="56" height="16" rx="3" fill="#E2E8F0" />
      <text x="61" y="13.5" fill="#0284C7" font-size="9" class="mono" font-weight="700">v0.0.23</text>

      <text x="0" y="32" fill="#475569" font-size="11.5" class="sans">
        Windows için çift süreçli, kaynak tasarruflu
      </text>
      <text x="0" y="47" fill="#475569" font-size="11.5" class="sans">
        dinamik duvar kâğıdı motoru (WinUI 3, .NET 10).
      </text>
    </g>
  </g>
</svg>
