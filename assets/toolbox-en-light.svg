<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <linearGradient id="toolLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="toolLightBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Frame -->
  <rect x="2" y="2" width="916" height="216" rx="12" fill="url(#toolLightBg)" stroke="url(#toolLightBorder)" stroke-width="1.5" />

  <!-- Top Terminal Header -->
  <rect x="2" y="2" width="916" height="32" rx="12" fill="#F1F5F9" />
  <path d="M 2 20 L 2 34 L 918 34 L 918 20" fill="#F1F5F9" />
  <line x1="2" y1="34" x2="918" y2="34" stroke="#E2E8F0" stroke-width="1" />
  
  <text x="24" y="22" fill="#0D9488" font-size="11" class="mono" font-weight="700">ENGINEERING TOOLBOX</text>
  <text x="180" y="22" fill="#64748B" font-size="10" class="mono">// VERIFIED PRODUCTION STACK ONLY</text>
  <text x="896" y="22" fill="#0284C7" font-size="10" class="mono" text-anchor="end">SYS_CONFIG: OK</text>

  <!-- Column 1: Backend & Systems -->
  <g transform="translate(24, 46)">
    <rect x="0" y="0" width="206" height="154" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <rect x="0" y="0" width="206" height="26" rx="8" fill="#F1F5F9" />
    <circle cx="14" cy="13" r="3" fill="#0284C7" />
    <text x="24" y="17" fill="#0284C7" font-size="10" class="mono" font-weight="700">BACKEND &amp; SYSTEMS</text>

    <!-- Items -->
    <g transform="translate(12, 36)">
      <text x="0" y="12" fill="#0F172A" font-size="11" class="mono" font-weight="600">Python 3.12</text>
      <text x="182" y="12" fill="#64748B" font-size="9.5" class="mono" text-anchor="end">FastAPI / AST</text>

      <text x="0" y="38" fill="#0F172A" font-size="11" class="mono" font-weight="600">.NET 10 / C# 13</text>
      <text x="182" y="38" fill="#64748B" font-size="9.5" class="mono" text-anchor="end">WinUI 3</text>

      <text x="0" y="64" fill="#0F172A" font-size="11" class="mono" font-weight="600">Named Pipe IPC</text>
      <text x="182" y="64" fill="#64748B" font-size="9.5" class="mono" text-anchor="end">Win32 Hook</text>

      <text x="0" y="90" fill="#0F172A" font-size="11" class="mono" font-weight="600">FastAPI</text>
      <text x="182" y="90" fill="#64748B" font-size="9.5" class="mono" text-anchor="end">Async REST</text>
    </g>
  </g>

  <!-- Column 2: Frontend & UI -->
  <g transform="translate(246, 46)">
    <rect x="0" y="0" width="206" height="154" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <rect x="0" y="0" width="206" height="26" rx="8" fill="#F1F5F9" />
    <circle cx="14" cy="13" r="3" fill="#0D9488" />
    <text x="24" y="17" fill="#0D9488" font-size="10" class="mono" font-weight="700">FRONTEND &amp; UI</text>

    <!-- Items -->
    <g transform="translate(12, 36)">
      <text x="0" y="12" fill="#0F172A" font-size="11" class="mono" font-weight="600">TypeScript</text>
      <text x="182" y="12" fill="#64748B" font-size="9.5" class="mono" text-anchor="end">Strict Typings</text>

      <text x="0" y="38" fill="#0F172A" font-size="11" class="mono" font-weight="600">React 18 / 19</text>
      <text x="182" y="38" fill="#64748B" font-size="9.5" class="mono" text-anchor="end">Vite / Hooks</text>

      <text x="0" y="64" fill="#0F172A" font-size="11" class="mono" font-weight="600">React Flow</text>
      <text x="182" y="64" fill="#64748B" font-size="9.5" class="mono" text-anchor="end">DAG Topology</text>

      <text x="0" y="90" fill="#0F172A" font-size="11" class="mono" font-weight="600">WinUI 3</text>
      <text x="182" y="90" fill="#64748B" font-size="9.5" class="mono" text-anchor="end">Windows App SDK</text>
    </g>
  </g>

  <!-- Column 3: Architecture & AI -->
  <g transform="translate(468, 46)">
    <rect x="0" y="0" width="206" height="154" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <rect x="0" y="0" width="206" height="26" rx="8" fill="#F1F5F9" />
    <circle cx="14" cy="13" r="3" fill="#7C3AED" />
    <text x="24" y="17" fill="#7C3AED" font-size="10" class="mono" font-weight="700">ARCH &amp; AI-NATIVE</text>

    <!-- Items -->
    <g transform="translate(12, 36)">
      <text x="0" y="12" fill="#0F172A" font-size="11" class="mono" font-weight="600">Tree-sitter AST</text>
      <text x="182" y="12" fill="#64748B" font-size="9.5" class="mono" text-anchor="end">Static Parsing</text>

      <text x="0" y="38" fill="#0F172A" font-size="11" class="mono" font-weight="600">MCP Protocol</text>
      <text x="182" y="38" fill="#64748B" font-size="9.5" class="mono" text-anchor="end">Tool Servers</text>

      <text x="0" y="64" fill="#0F172A" font-size="11" class="mono" font-weight="600">Agent Skills</text>
      <text x="182" y="64" fill="#64748B" font-size="9.5" class="mono" text-anchor="end">Autonomous</text>

      <text x="0" y="90" fill="#0F172A" font-size="11" class="mono" font-weight="600">Tarjan SCC</text>
      <text x="182" y="90" fill="#64748B" font-size="9.5" class="mono" text-anchor="end">Cycle Detect</text>
    </g>
  </g>

  <!-- Column 4: Dev Tools & Pipelines -->
  <g transform="translate(690, 46)">
    <rect x="0" y="0" width="206" height="154" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <rect x="0" y="0" width="206" height="26" rx="8" fill="#F1F5F9" />
    <circle cx="14" cy="13" r="3" fill="#D97706" />
    <text x="24" y="17" fill="#D97706" font-size="10" class="mono" font-weight="700">DEV TOOLS &amp; OPS</text>

    <!-- Items -->
    <g transform="translate(12, 36)">
      <text x="0" y="12" fill="#0F172A" font-size="11" class="mono" font-weight="600">Git &amp; GitHub</text>
      <text x="182" y="12" fill="#64748B" font-size="9.5" class="mono" text-anchor="end">Version Ctrl</text>

      <text x="0" y="38" fill="#0F172A" font-size="11" class="mono" font-weight="600">GitHub Actions</text>
      <text x="182" y="38" fill="#64748B" font-size="9.5" class="mono" text-anchor="end">CI / CD Auto</text>

      <text x="0" y="64" fill="#0F172A" font-size="11" class="mono" font-weight="600">Docker</text>
      <text x="182" y="64" fill="#64748B" font-size="9.5" class="mono" text-anchor="end">Containers</text>

      <text x="0" y="90" fill="#0F172A" font-size="11" class="mono" font-weight="600">Pytest / Mypy</text>
      <text x="182" y="90" fill="#64748B" font-size="9.5" class="mono" text-anchor="end">Type Safety</text>
    </g>
  </g>
</svg>
