<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#0B1020" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0.5" />
    </linearGradient>

    <!-- Accent Text Gradient -->
    <linearGradient id="cyanMintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#5EEAD4" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>

    <!-- Title Glow Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="arcadeGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="24" cy="24" r="0.75" fill="#38BDF8" fill-opacity="0.25" />
    </pattern>

    <!-- Circuit Path Filter for soft glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    
    @keyframes pulseLive {
      0%, 100% { fill: #5EEAD4; opacity: 1; r: 3.5; }
      50% { fill: #38BDF8; opacity: 0.4; r: 4.5; }
    }

    @keyframes circuitRun {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes pacmanMouth {
      0%, 100% { d: path("M 0 0 L 12 -7 A 14 14 0 1 0 12 7 Z"); }
      50% { d: path("M 0 0 L 14 -1 A 14 14 0 1 0 14 1 Z"); }
    }

    .cursor { animation: cursorBlink 1s infinite; }
    .live-dot { animation: pulseLive 2.4s infinite ease-in-out; }
    .circuit-line {
      stroke-dasharray: 40, 200;
      animation: circuitRun 6s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor, .live-dot, .circuit-line {
        animation: none !important;
      }
    }
  </style>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="916" height="336" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  
  <!-- Subtle Grid Overlay -->
  <rect x="4" y="4" width="912" height="332" rx="12" fill="url(#arcadeGrid)" />

  <!-- Animated Circuit Line Accent at Top Border -->
  <path class="circuit-line" d="M 14 2 L 400 2 L 430 14 L 600 14 L 630 2 L 906 2" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.6" />

  <!-- Top Terminal Bar -->
  <g id="terminal-bar">
    <rect x="2" y="2" width="916" height="38" rx="14" fill="#0D1322" fill-opacity="0.9" />
    <line x1="2" y1="40" x2="918" y2="40" stroke="#1F2937" stroke-width="1" />

    <!-- macOS / Terminal Window Dots -->
    <circle cx="24" cy="21" r="5" fill="#EF4444" />
    <circle cx="40" cy="21" r="5" fill="#FACC15" />
    <circle cx="56" cy="21" r="5" fill="#10B981" />

    <!-- Terminal Prompt & Path -->
    <text x="80" y="25" fill="#94A3B8" font-size="12" class="mono" font-weight="500">
      cihan@workstation:<tspan fill="#38BDF8">~/profile</tspan><tspan fill="#5EEAD4"> (arcade-v2.6)</tspan>
    </text>

    <!-- Top Right Status Badge -->
    <g transform="translate(670, 12)">
      <rect x="0" y="0" width="230" height="20" rx="4" fill="#111827" stroke="#1E293B" stroke-width="1" />
      <circle class="live-dot" cx="14" cy="10" r="3.5" fill="#5EEAD4" />
      <text x="26" y="14" fill="#94A3B8" font-size="10.5" class="mono" font-weight="600">FIRAT UNIV // SE YR-2</text>
      <text x="180" y="14" fill="#38BDF8" font-size="10.5" class="mono" font-weight="700">● LIVE</text>
    </g>
  </g>

  <!-- Left Side: Engineering & Arcade Decorative Diagram -->
  <g id="workstation-schematic" transform="translate(36, 68)">
    <!-- Retro Arcade Mini Header Indicator -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="140" height="20" rx="4" fill="#1E293B" fill-opacity="0.6" stroke="#38BDF8" stroke-width="0.8" />
      <text x="10" y="14" fill="#5EEAD4" font-size="10" class="mono" font-weight="700">ARCADE ENGINE 01</text>
    </g>

    <!-- Pac-Man Minimal Arcade Node -->
    <g transform="translate(170, 10)">
      <circle cx="0" cy="0" r="10" fill="#FACC15" />
      <!-- Mouth cut -->
      <path d="M 0 0 L 10 -6 A 10 10 0 0 0 10 6 Z" fill="#0B1020" />
      <!-- Food pellets -->
      <circle cx="22" cy="0" r="2.5" fill="#5EEAD4" opacity="0.8" />
      <circle cx="36" cy="0" r="2.5" fill="#38BDF8" opacity="0.8" />
      <circle cx="50" cy="0" r="2.5" fill="#8B5CF6" opacity="0.8" />
    </g>

    <!-- Main Title -->
    <text x="0" y="66" fill="url(#titleGrad)" font-size="44" class="sans" font-weight="900" letter-spacing="1.5">
      CIHAN AKALIN
    </text>

    <!-- Subtitle Stack -->
    <g transform="translate(2, 94)">
      <text x="0" y="0" fill="#38BDF8" font-size="14.5" class="mono" font-weight="700" letter-spacing="0.5">
        SOFTWARE ENGINEERING STUDENT <tspan fill="#64748B">|</tspan> <tspan fill="#5EEAD4">FIRAT UNIVERSITY</tspan>
      </text>
      <text x="0" y="24" fill="#E2E8F0" font-size="13.5" class="sans" font-weight="500">
        AI-Native Developer Tools &amp; Compilers <tspan fill="#8B5CF6">•</tspan> Desktop &amp; Software Architecture
      </text>
    </g>

    <!-- Slogan with Terminal Prompt & Blinking Cursor -->
    <g transform="translate(2, 154)">
      <rect x="-6" y="-18" width="480" height="30" rx="6" fill="#111827" fill-opacity="0.75" stroke="#1E293B" stroke-width="1" />
      <text x="8" y="2" fill="#FACC15" font-size="13" class="mono" font-weight="700">&gt;</text>
      <text x="24" y="2" fill="#F8FAFC" font-size="13" class="mono" font-weight="500">
        "Building tools that make developers more effective."
      </text>
      <rect class="cursor" x="432" y="-10" width="8" height="15" fill="#38BDF8" />
    </g>

    <!-- Technical Tags / Stack Badges -->
    <g transform="translate(0, 204)">
      <!-- Badge 1: AST / Static Analysis -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="154" height="26" rx="6" fill="#1E293B" fill-opacity="0.5" stroke="#38BDF8" stroke-width="1" />
        <circle cx="14" cy="13" r="3" fill="#38BDF8" />
        <text x="24" y="17" fill="#E2E8F0" font-size="11" class="mono" font-weight="600">Tree-sitter &amp; AST</text>
      </g>

      <!-- Badge 2: AI & MCP -->
      <g transform="translate(164, 0)">
        <rect x="0" y="0" width="138" height="26" rx="6" fill="#1E293B" fill-opacity="0.5" stroke="#8B5CF6" stroke-width="1" />
        <circle cx="14" cy="13" r="3" fill="#8B5CF6" />
        <text x="24" y="17" fill="#E2E8F0" font-size="11" class="mono" font-weight="600">MCP Protocol</text>
      </g>

      <!-- Badge 3: Desktop Engineering -->
      <g transform="translate(312, 0)">
        <rect x="0" y="0" width="170" height="26" rx="6" fill="#1E293B" fill-opacity="0.5" stroke="#5EEAD4" stroke-width="1" />
        <circle cx="14" cy="13" r="3" fill="#5EEAD4" />
        <text x="24" y="17" fill="#E2E8F0" font-size="11" class="mono" font-weight="600">WinUI 3 &amp; .NET 10</text>
      </g>

      <!-- Badge 4: Architecture -->
      <g transform="translate(492, 0)">
        <rect x="0" y="0" width="144" height="26" rx="6" fill="#1E293B" fill-opacity="0.5" stroke="#FACC15" stroke-width="1" />
        <circle cx="14" cy="13" r="3" fill="#FACC15" />
        <text x="24" y="17" fill="#E2E8F0" font-size="11" class="mono" font-weight="600">Systems &amp; IPC</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Engineering Telemetry & Radar Grid Widget -->
  <g id="telemetry-box" transform="translate(680, 68)">
    <rect x="0" y="0" width="206" height="232" rx="10" fill="#0D1322" stroke="#1E293B" stroke-width="1.2" />
    
    <!-- Telemetry Header -->
    <rect x="0" y="0" width="206" height="26" rx="10" fill="#111827" />
    <path d="M 0 16 L 0 26 L 206 26 L 206 16" fill="#111827" />
    <line x1="0" y1="26" x2="206" y2="26" stroke="#1F2937" stroke-width="1" />
    <text x="12" y="17" fill="#94A3B8" font-size="10" class="mono" font-weight="700">CORE METRICS // SYS_ST</text>

    <!-- Radar / Circular Scope Accent -->
    <g transform="translate(103, 85)">
      <!-- Outer target circles -->
      <circle cx="0" cy="0" r="42" fill="none" stroke="#1E293B" stroke-width="1" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="3,3" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.5" />
      <!-- Crosshairs -->
      <line x1="-46" y1="0" x2="46" y2="0" stroke="#1E293B" stroke-width="1" />
      <line x1="0" y1="-46" x2="0" y2="46" stroke="#1E293B" stroke-width="1" />
      <!-- Animated Sweep Hand -->
      <line x1="0" y1="0" x2="30" y2="-30" stroke="#5EEAD4" stroke-width="1.8" filter="url(#cyanGlow)" />
      <circle cx="0" cy="0" r="3" fill="#38BDF8" />
      <circle cx="22" cy="-14" r="2.5" fill="#FACC15" />
      <circle cx="-16" cy="20" r="2" fill="#5EEAD4" />
      <circle cx="12" cy="24" r="2" fill="#8B5CF6" />
    </g>

    <!-- Key Telemetry Readouts -->
    <g transform="translate(14, 148)">
      <line x1="0" y1="0" x2="178" y2="0" stroke="#1F2937" stroke-width="1" />
      
      <text x="0" y="18" fill="#64748B" font-size="10" class="mono">STATUS</text>
      <text x="178" y="18" fill="#5EEAD4" font-size="10.5" class="mono" font-weight="700" text-anchor="end">READY / ACTIVE</text>

      <text x="0" y="36" fill="#64748B" font-size="10" class="mono">DEV ARCH</text>
      <text x="178" y="36" fill="#38BDF8" font-size="10.5" class="mono" font-weight="700" text-anchor="end">AST + IPC</text>

      <text x="0" y="54" fill="#64748B" font-size="10" class="mono">TARGET</text>
      <text x="178" y="54" fill="#FACC15" font-size="10.5" class="mono" font-weight="700" text-anchor="end">PROD-GRADE</text>

      <text x="0" y="72" fill="#64748B" font-size="10" class="mono">REPOS</text>
      <text x="178" y="72" fill="#8B5CF6" font-size="10.5" class="mono" font-weight="700" text-anchor="end">PUBLIC &amp; OPEN</text>
    </g>
  </g>

  <!-- Bottom Accent Status Bar -->
  <g transform="translate(26, 316)">
    <text x="0" y="0" fill="#64748B" font-size="10" class="mono">
      PORT: <tspan fill="#38BDF8">443/TLS</tspan> &nbsp;•&nbsp;
      PROTOCOL: <tspan fill="#5EEAD4">GIT-NATIVE</tspan> &nbsp;•&nbsp;
      LOCATION: <tspan fill="#94A3B8">ELAZIG, TR</tspan> &nbsp;•&nbsp;
      WORKSTATION: <tspan fill="#FACC15">CIHANAK1_ARCADE</tspan>
    </text>
    <text x="868" y="0" fill="#64748B" font-size="10" class="mono" text-anchor="end">
      [SECURED_PIPELINE // VERIFIED]
    </text>
  </g>
</svg>
